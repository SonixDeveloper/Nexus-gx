id: com.sonixdeveloper.nexusgx
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: nexus-gx
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-download
modules:
  - name: nexus-gx
    buildsystem: simple
    build-commands:
      - install -d /app/lib/nexus-gx
      - cp -a browser/. /app/lib/nexus-gx/
      - install -Dm755 launcher /app/bin/nexus-gx
      - install -Dm644 com.sonixdeveloper.nexusgx.desktop /app/share/applications/com.sonixdeveloper.nexusgx.desktop
      - install -Dm644 icon.png /app/share/icons/hicolor/256x256/apps/com.sonixdeveloper.nexusgx.png
      - install -Dm644 com.sonixdeveloper.nexusgx.metainfo.xml /app/share/metainfo/com.sonixdeveloper.nexusgx.metainfo.xml
    sources:
      - type: dir
        path: browser
        dest: browser
      - type: file
        path: launcher
      - type: file
        path: com.sonixdeveloper.nexusgx.desktop
      - type: file
        path: com.sonixdeveloper.nexusgx.metainfo.xml
      - type: file
        path: icon.png
