id: io.github.nexusgx.NexusGX
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: nexus-gx
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
modules:
  - name: nexus-gx
    buildsystem: simple
    build-commands:
      - install -d /app/nexus-gx
      - cp -a linux-unpacked/. /app/nexus-gx/
      - install -Dm755 flatpak-launcher /app/bin/nexus-gx
      - install -Dm644 io.github.nexusgx.NexusGX.desktop /app/share/applications/io.github.nexusgx.NexusGX.desktop
      - install -Dm644 icon.png /app/share/icons/hicolor/256x256/apps/io.github.nexusgx.NexusGX.png
      - install -Dm644 io.github.nexusgx.NexusGX.metainfo.xml /app/share/metainfo/io.github.nexusgx.NexusGX.metainfo.xml
    sources:
      - type: dir
        path: ../release/linux-unpacked
        dest: linux-unpacked
      - type: file
        path: flatpak-launcher
      - type: file
        path: icon.png
      - type: file
        path: io.github.nexusgx.NexusGX.desktop
      - type: file
        path: io.github.nexusgx.NexusGX.metainfo.xml
