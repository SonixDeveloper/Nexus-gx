name: NEXUS GX Gecko ESR
on:
  pull_request:
    paths:
      - 'gecko/**'
      - 'src/shared/model.ts'
      - 'packaging/icon.*'
      - '.github/workflows/gecko.yml'
  workflow_dispatch:
    inputs:
      compile:
        description: Compile native x86_64 Linux Gecko
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: gecko-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m unittest discover -s gecko/tests
      - run: bash -n gecko/fetch-source.sh
      - run: bash gecko/fetch-source.sh
      - run: python3 gecko/prepare.py gecko/work/source
  compile-linux:
    if: (github.event_name == 'workflow_dispatch' && inputs.compile) || (github.event_name == 'pull_request' && github.head_ref == 'nexus-gx-gecko' && github.event.pull_request.head.repo.full_name == github.repository)
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - name: Free runner storage for the native build
        run: |
          sudo rm -rf -- /usr/local/lib/android /opt/ghc /usr/share/dotnet
          df -h .
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev python3-venv pkg-config libgtk-3-dev libasound2-dev libdbus-glib-1-dev libxt-dev libpulse-dev libx11-xcb-dev libxrandr-dev libxss-dev unzip zip yasm gpg
      - run: bash gecko/fetch-source.sh
      - run: python3 gecko/prepare.py gecko/work/source
      - name: Compile and package Gecko
        working-directory: gecko/work/source
        env:
          MOZCONFIG: ${{ github.workspace }}/gecko/mozconfig
        run: |
          ./mach build
          ./mach package
          obj-nexus-gx/dist/bin/nexus-gx --version
          mkdir -p "$RUNNER_TEMP/nexus-gecko-profile"
          timeout 60 obj-nexus-gx/dist/bin/nexus-gx --headless --no-remote \
            --profile "$RUNNER_TEMP/nexus-gecko-profile" --screenshot "$RUNNER_TEMP/nexus-gecko.png" \
            'data:text/html,<title>NEXUS GX Gecko smoke test</title><h1>NEXUS GX</h1>'
          test -s "$RUNNER_TEMP/nexus-gecko.png"
      - uses: actions/upload-artifact@v6
        with:
          name: nexus-gx-gecko-linux-x86_64
          if-no-files-found: error
          path: gecko/work/source/obj-nexus-gx/dist/*.tar.*
