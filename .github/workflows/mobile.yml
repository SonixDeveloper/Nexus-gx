name: NEXUS GX mobile
on:
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
env:
  EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npx expo prebuild --platform android --no-install
      - name: Build and verify Android APK
        run: |
          set -euo pipefail
          cd android
          ./gradlew :app:assembleRelease --no-daemon
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          sdk_tools="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$sdk_tools" verify "$apk"
          mkdir -p ../dist
          cp "$apk" ../dist/NEXUS-GX-Android-preview.apk
      - uses: actions/upload-artifact@v6
        with:
          name: nexus-gx-android-apk
          if-no-files-found: error
          path: mobile/dist/NEXUS-GX-Android-preview.apk
  ios-simulator:
    runs-on: xcode-27
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npx expo prebuild --platform ios --no-install
      - name: Install native dependencies
        run: |
          cd ios
          if [ -f Podfile ]; then pod install; fi
      - name: Build iPhone and iPad simulator app
        run: |
          set -euo pipefail
          cd ios
          shopt -s nullglob
          workspaces=(*.xcworkspace)
          projects=(*.xcodeproj)
          if (( ${#workspaces[@]} )); then
            container=(-workspace "${workspaces[0]}")
          else
            container=(-project "${projects[0]}")
          fi
          scheme="$(xcodebuild "${container[@]}" -list -json | python3 -c 'import json, sys; d=json.load(sys.stdin); s=next(iter(d.values()))["schemes"]; print(next(x for x in s if x.replace(" ", "").lower() == "nexusgx"))')"
          xcodebuild "${container[@]}" -scheme "$scheme" -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/nexus-ios" \
            CODE_SIGNING_ALLOWED=NO build
          apps=("$RUNNER_TEMP"/nexus-ios/Build/Products/Release-iphonesimulator/*.app)
          test "${#apps[@]}" -eq 1
          test -s "${apps[0]}/Info.plist"
          mkdir -p ../dist
          ditto -c -k --keepParent "${apps[0]}" ../dist/NEXUS-GX-iOS-Simulator.zip
      - uses: actions/upload-artifact@v6
        with:
          name: nexus-gx-ios-simulator
          if-no-files-found: error
          path: mobile/dist/NEXUS-GX-iOS-Simulator.zip
